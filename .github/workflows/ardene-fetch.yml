name: ARDENE preview assets

on:
  push:
    branches: [ardene-preview]

permissions:
  contents: write

jobs:
  fetch:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ardene-preview
      - name: Inspect firestorage share route
        run: |
          mkdir -p ardene-debug
          curl -L --fail --retry 3 -A 'Mozilla/5.0' 'https://firestorage.ai/ja/f/jkkHmfVG3oSm' -o ardene-debug/share.html
          curl -L --fail --retry 3 -A 'Mozilla/5.0' 'https://firestorage.ai/_next/static/chunks/app/(files)/ja/f/page-4d19ae0a4ce39d79.js' -o ardene-debug/page.js
          python - <<'PY'
          import re, html
          from pathlib import Path

          share = Path('ardene-debug/share.html').read_text(encoding='utf-8', errors='replace')
          js = Path('ardene-debug/page.js').read_text(encoding='utf-8', errors='replace')

          urls=[]
          for text in (share, js):
              for pat in [r'href=["\']([^"\']+)', r'src=["\']([^"\']+)', r'https?://[^"\'<> )]+']:
                  urls += re.findall(pat, text)

          candidates=[]
          patterns = [
              r'[^"\']{0,120}/api/[^"\']{0,220}',
              r'[^"\']{0,120}download[^"\']{0,220}',
              r'[^"\']{0,120}share[^"\']{0,220}',
              r'[^"\']{0,120}file[^"\']{0,220}',
              r'fetch\([^)]{0,400}\)',
          ]
          for pat in patterns:
              for m in re.finditer(pat, js, flags=re.I):
                  candidates.append(m.group(0))

          Path('ardene-debug/links.txt').write_text('\n'.join(dict.fromkeys(html.unescape(u) for u in urls)), encoding='utf-8')
          Path('ardene-debug/candidates.txt').write_text('\n\n'.join(dict.fromkeys(candidates)), encoding='utf-8')
          print('share bytes', len(share), 'js bytes', len(js), 'candidates', len(candidates))
          print('\n\n'.join(candidates[:80]))
          PY
      - name: Commit debug output
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ardene-debug
          git commit -m 'Inspect firestorage share API [skip ci]' || exit 0
          git push origin HEAD:ardene-preview
