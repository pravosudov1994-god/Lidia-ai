name: ARDENE preview assets

on:
  push:
    branches: [ardene-preview]

permissions:
  contents: write

jobs:
  fetch:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ardene-preview
      - name: Replace slide 2 with approved original PNG
        run: |
          set -euo pipefail
          mkdir -p ardene-site ardene-debug
          API='https://api.firestorage.ai/dev/file/shares/LCGzcmXMrGSM'
          curl -fsSL --retry 3 "$API/files?maxResults=1000" -o ardene-debug/slide2-metadata.json
          FILE_ID=$(python - <<'PY'
          import json
          d=json.load(open('ardene-debug/slide2-metadata.json'))
          files=d.get('files',[])
          target='ARDENE_slide_02_brand_intro_1080x1920.png'
          for f in files:
              if f.get('fileName')==target:
                  print(f['fileId'])
                  break
          else:
              raise SystemExit('approved slide 2 not found')
          PY
          )
          curl -fsSL --retry 3 -X POST "$API/files/$FILE_ID/download" -o ardene-debug/slide2-download.json
          URL=$(python -c "import json; print(json.load(open('ardene-debug/slide2-download.json'))['downloadUrl'])")
          curl -fsSL --retry 3 "$URL" -o ardene-site/slide-02.png
          python - <<'PY'
          import struct, pathlib, hashlib
          p=pathlib.Path('ardene-site/slide-02.png')
          b=p.read_bytes()
          if b[:8] != b'\x89PNG\r\n\x1a\n': raise SystemExit('not PNG')
          w,h=struct.unpack('>II',b[16:24])
          print('slide-02.png',len(b),w,h,hashlib.sha256(b).hexdigest())
          if (w,h)!=(1080,1920): raise SystemExit(f'unexpected {w}x{h}')
          PY
      - name: Commit corrected slide 2
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ardene-site/slide-02.png ardene-debug/slide2-metadata.json
          git commit -m 'Replace ARDENE slide 2 with approved version [skip ci]' || exit 0
          git push origin HEAD:ardene-preview
