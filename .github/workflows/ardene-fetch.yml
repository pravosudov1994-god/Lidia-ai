name: ARDENE preview assets

on:
  push:
    branches: [ardene-preview]

permissions:
  contents: write

jobs:
  fetch:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ardene-preview
      - name: Fetch original PNG files from firestorage
        run: |
          set -euo pipefail
          mkdir -p ardene-site ardene-debug
          API='https://api.firestorage.ai/dev/file/shares/jkkHmfVG3oSm'
          curl -fsSL --retry 3 "$API/files?maxResults=1000" -o ardene-debug/metadata.json
          python - <<'PY'
          import json, pathlib
          meta=json.loads(pathlib.Path('ardene-debug/metadata.json').read_text())
          files=meta.get('files',[])
          for f in files:
              print(f.get('fileId'), f.get('fileName'), f.get('sizeBytes'), f.get('contentType'))
          wanted={
              'ARDENE_slide_01_cover_1080x1920.png':'slide-01.png',
              'ARDENE_slide_02_brand_intro_1080x1920.png':'slide-02.png',
          }
          found={f.get('fileName'):f for f in files}
          missing=[n for n in wanted if n not in found]
          if missing:
              raise SystemExit('Missing expected files: '+', '.join(missing))
          pathlib.Path('ardene-debug/file-map.tsv').write_text('\n'.join(f"{found[name]['fileId']}\t{name}\t{dest}" for name,dest in wanted.items())+'\n')
          PY
          while IFS=$'\t' read -r FILE_ID FILE_NAME DEST; do
            curl -fsSL --retry 3 -X POST "$API/files/$FILE_ID/download" -o ardene-debug/download.json
            URL=$(python -c "import json; print(json.load(open('ardene-debug/download.json'))['downloadUrl'])")
            curl -fsSL --retry 3 "$URL" -o "ardene-site/$DEST"
            echo "$FILE_NAME -> $DEST ($(wc -c < "ardene-site/$DEST") bytes)"
          done < ardene-debug/file-map.tsv
          python - <<'PY'
          import struct, pathlib
          for name in ['slide-01.png','slide-02.png']:
              p=pathlib.Path('ardene-site')/name
              b=p.read_bytes()
              if b[:8] != b'\x89PNG\r\n\x1a\n':
                  raise SystemExit(f'{name}: not a PNG')
              w,h=struct.unpack('>II',b[16:24])
              print(name, len(b), w, h)
              if (w,h)!=(1080,1920):
                  raise SystemExit(f'{name}: unexpected dimensions {w}x{h}')
          PY
      - name: Commit original assets
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ardene-site ardene-debug/metadata.json ardene-debug/file-map.tsv
          git commit -m 'Add original ARDENE PNG assets [skip ci]' || exit 0
          git push origin HEAD:ardene-preview
